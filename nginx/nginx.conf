worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html index.htm;
        include /etc/nginx/mime.types;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Medication methods are published once, at /medications/{slug}/.
        # Permanent redirects for the old duplicate /methods/{slug}/ URLs.
        location = /methods/bupropion/        { return 301 /medications/bupropion/; }
        location = /methods/bupropion         { return 301 /medications/bupropion/; }
        location = /methods/cytisine/         { return 301 /medications/cytisine/; }
        location = /methods/cytisine          { return 301 /medications/cytisine/; }
        location = /methods/nicotine-gum/     { return 301 /medications/nicotine-gum/; }
        location = /methods/nicotine-gum      { return 301 /medications/nicotine-gum/; }
        location = /methods/nicotine-lozenge/ { return 301 /medications/nicotine-lozenge/; }
        location = /methods/nicotine-lozenge  { return 301 /medications/nicotine-lozenge/; }
        location = /methods/nicotine-patch/   { return 301 /medications/nicotine-patch/; }
        location = /methods/nicotine-patch    { return 301 /medications/nicotine-patch/; }
        location = /methods/varenicline/      { return 301 /medications/varenicline/; }
        location = /methods/varenicline       { return 301 /medications/varenicline/; }

        location / {
            try_files $uri $uri/index.html =404;
        }
    }
}